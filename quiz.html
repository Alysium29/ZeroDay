<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Day - Quiz</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./quiz.css">
    <script src="./quiz.js" defer></script>
</head>

<body>

    <nav>
        <a href="./index.html">Rules</a>
    </nav>

    <div id="quiz-container">

        <h1>Zero Day Quiz</h1>

        <div id="difficulty-selector" role="group" aria-label="Quiz difficulty">
            <button type="button" class="difficulty-button" data-difficulty="Easy" aria-pressed="false">
                Easy
            </button>
            <button type="button" class="difficulty-button" data-difficulty="Hard" aria-pressed="false">
                Hard
            </button>
        </div>

        <div id="quiz-content" hidden>
            <h2 id="question"></h2>

            <div id="answers"></div>

            <div class="button-row">
                <button id="confirm_button" disabled>
                    Confirm
                </button>

                <button id="reload_button" hidden>
                    New Quiz
                </button>
            </div>

            <span id="answer" hidden></span>
        </div>

    </div>

</body>

</html>
